name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Cross-compile release archives
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION_NO_V="${TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          LDFLAGS="-s -w -X github.com/PapaDanielVi/cafebazaar_cli/internal/cli.Version=${TAG} -X github.com/PapaDanielVi/cafebazaar_cli/internal/cli.Commit=${COMMIT} -X github.com/PapaDanielVi/cafebazaar_cli/internal/cli.BuildDate=${BUILD_DATE}"

          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            stage="dist/stage_${goos}_${goarch}"
            mkdir -p "$stage"
            bin_name="bazaar"
            if [[ "$goos" == "windows" ]]; then
              bin_name="bazaar.exe"
            fi

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "${stage}/${bin_name}" ./cmd/bazaar
            cp README.md LICENSE "$stage/"

            if [[ "$goos" == "windows" ]]; then
              archive="bazaar_${VERSION_NO_V}_${goos}_${goarch}.zip"
              (cd "$stage" && zip -q "../${archive}" "$bin_name" README.md LICENSE)
            else
              archive="bazaar_${VERSION_NO_V}_${goos}_${goarch}.tar.gz"
              tar -C "$stage" -czf "dist/${archive}" "$bin_name" README.md LICENSE
            fi
            rm -rf "$stage"
          done

          (cd dist && sha256sum bazaar_* > checksums.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          extra_flags=()
          if [[ "$TAG" == *"-"* ]]; then
            extra_flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --title "bazaar ${TAG}" \
            --generate-notes \
            "${extra_flags[@]}"
