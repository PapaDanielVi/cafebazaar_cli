name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Cross-compile release archives
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION_NO_V="${TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          LDFLAGS="-s -w -X github.com/PapaDanielVi/cafebazaar_cli/internal/cli.Version=${TAG} -X github.com/PapaDanielVi/cafebazaar_cli/internal/cli.Commit=${COMMIT} -X github.com/PapaDanielVi/cafebazaar_cli/internal/cli.BuildDate=${BUILD_DATE}"

          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            stage="dist/stage_${goos}_${goarch}"
            mkdir -p "$stage"
            bin_name="bazaar"
            if [[ "$goos" == "windows" ]]; then
              bin_name="bazaar.exe"
            fi

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "${stage}/${bin_name}" ./cmd/bazaar
            cp README.md LICENSE "$stage/"

            if [[ "$goos" == "windows" ]]; then
              archive="bazaar_${VERSION_NO_V}_${goos}_${goarch}.zip"
              (cd "$stage" && zip -q "../${archive}" "$bin_name" README.md LICENSE)
            else
              archive="bazaar_${VERSION_NO_V}_${goos}_${goarch}.tar.gz"
              tar -C "$stage" -czf "dist/${archive}" "$bin_name" README.md LICENSE
            fi
            rm -rf "$stage"
          done

          (cd dist && sha256sum bazaar_* > checksums.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets with --clobber."
            gh release upload "$TAG" dist/* --clobber
          else
            extra_flags=()
            if [[ "$TAG" == *"-"* ]]; then
              extra_flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/* \
              --title "bazaar ${TAG}" \
              --generate-notes \
              "${extra_flags[@]}"
          fi

      - name: Update Homebrew Tap Cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping automatic Homebrew tap update."
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SHA_DARWIN_AMD64="$(awk '$2 == "bazaar_'"${VERSION}"'_darwin_amd64.tar.gz" { print $1 }' dist/checksums.txt)"
          SHA_DARWIN_ARM64="$(awk '$2 == "bazaar_'"${VERSION}"'_darwin_arm64.tar.gz" { print $1 }' dist/checksums.txt)"
          SHA_LINUX_AMD64="$(awk '$2 == "bazaar_'"${VERSION}"'_linux_amd64.tar.gz" { print $1 }' dist/checksums.txt)"
          SHA_LINUX_ARM64="$(awk '$2 == "bazaar_'"${VERSION}"'_linux_arm64.tar.gz" { print $1 }' dist/checksums.txt)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/PapaDanielVi/homebrew-tap.git" /tmp/homebrew-tap
          cat > /tmp/homebrew-tap/Casks/bazaar.rb <<EOF
          # This file is auto-updated on stable releases of PapaDanielVi/cafebazaar_cli.
          cask "bazaar" do
            version "${VERSION}"

            on_macos do
              on_arm do
                sha256 "${SHA_DARWIN_ARM64}"
                url "https://github.com/PapaDanielVi/cafebazaar_cli/releases/download/v#{version}/bazaar_#{version}_darwin_arm64.tar.gz"
              end
              on_intel do
                sha256 "${SHA_DARWIN_AMD64}"
                url "https://github.com/PapaDanielVi/cafebazaar_cli/releases/download/v#{version}/bazaar_#{version}_darwin_amd64.tar.gz"
              end
            end
            on_linux do
              on_arm do
                sha256 "${SHA_LINUX_ARM64}"
                url "https://github.com/PapaDanielVi/cafebazaar_cli/releases/download/v#{version}/bazaar_#{version}_linux_arm64.tar.gz"
              end
              on_intel do
                sha256 "${SHA_LINUX_AMD64}"
                url "https://github.com/PapaDanielVi/cafebazaar_cli/releases/download/v#{version}/bazaar_#{version}_linux_amd64.tar.gz"
              end
            end

            name "bazaar"
            desc "CLI for CafeBazaar Android app publishing, releases, and user reviews"
            homepage "https://github.com/PapaDanielVi/cafebazaar_cli"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "bazaar"

            postflight_steps do
              on_macos do
                run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{staged_path}}/bazaar"], must_succeed: false
              end
            end

            zap :not_required
          end
          EOF

          # Remove leading indentation introduced by YAML block heredoc.
          sed -i 's/^          //' /tmp/homebrew-tap/Casks/bazaar.rb

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/bazaar.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: update bazaar cask to ${TAG}"
            git push origin HEAD:main
          fi
